<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛУДКА · Кейс-баттл CS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #0a0f1e, #03050b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(12, 20, 35, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px 20px 16px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 200, 50, 0.3), 0 0 30px #ffb34740;
            border: 1px solid #ffcf6e;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffd966, #ff9f4b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px #ffbb33, 0 0 40px #ff7b00;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .balance-box {
            background: #101a28;
            border: 2px solid #ffb347;
            border-radius: 60px;
            padding: 6px 18px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffe9b6;
            box-shadow: inset 0 0 15px #00000055, 0 6px 0 #634d1e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-box span { color: #ffd966; font-size: 1.5rem; }

        .money-btn {
            background: linear-gradient(180deg, #2b3b55, #121d2e);
            border: none;
            border-radius: 50%;
            width: 38px; height: 38px;
            font-size: 1.3rem; font-weight: 900;
            color: #ffdd99; cursor: pointer;
            border-bottom: 4px solid #050a10;
            transition: 0.08s linear;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px #00000080;
        }
        .money-btn:hover { background: #3a4f6e; color: #ffd966; }
        .money-btn:active { transform: translateY(3px); border-bottom-width: 1px; }
        .money-btn.plus { background: linear-gradient(180deg, #3ba55c, #24713b); color: #e0ffe0; border-bottom-color: #0f3a1e; }
        .money-btn.plus:hover { background: #4cc76f; }
        .money-btn.minus { background: linear-gradient(180deg, #b84949, #7a2a2a); color: #ffe0e0; border-bottom-color: #3d1212; }
        .money-btn.minus:hover { background: #d15a5a; }

        .sound-toggle {
            background: #1a2436;
            border: 2px solid #ffb34760;
            border-radius: 50%;
            width: 38px; height: 38px;
            font-size: 1.2rem; cursor: pointer;
            color: #ffd966;
            display: flex; align-items: center; justify-content: center;
            transition: 0.1s;
        }
        .sound-toggle:hover { border-color: #ffb347; background: #253449; }

        .goal-banner {
            background: linear-gradient(90deg, #1a1208, #2a1f0a, #1a1208);
            border: 2px solid #ffb34760;
            border-radius: 20px;
            padding: 8px 16px;
            margin-bottom: 12px;
            text-align: center;
            color: #ffd966;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 20px #ffb34720;
        }
        .goal-banner .goal-progress { display: inline-block; margin-left: 8px; color: #7fffb0; font-weight: 900; }

        .achievements-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 6px 8px;
            background: #070c14c0;
            border-radius: 16px;
            border: 1px solid #2b3e5a;
            align-items: center;
        }
        .ach-label {
            font-size: 0.7rem; font-weight: 800;
            text-transform: uppercase; color: #8a9fc0;
            letter-spacing: 1px; margin-right: 4px;
        }
        .ach-badge {
            display: flex; align-items: center; gap: 4px;
            background: #1a2436;
            border: 1px solid #3c5777;
            border-radius: 20px;
            padding: 3px 8px;
            font-size: 0.65rem; font-weight: 700;
            color: #5b6f8c;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .ach-badge.unlocked {
            background: linear-gradient(180deg, #3a2a0a, #2a1f08);
            border-color: #ffd966;
            color: #ffd966;
            box-shadow: 0 0 10px #ffb34740;
        }
        .ach-badge .ach-icon { font-size: 0.9rem; }
        .ach-badge.unlocked .ach-icon { filter: drop-shadow(0 0 4px #ffb347); }

        .ach-badge::after {
            content: attr(data-desc);
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #0c1420;
            color: #ffd966;
            border: 1px solid #ffb347;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            z-index: 100;
            box-shadow: 0 4px 15px #000000aa;
        }
        .ach-badge:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .cases-terminal-wrapper {
            display: flex;
            gap: 16px;
            margin: 0 0 14px;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cases-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        .case-card {
            background: #0b111e;
            border-radius: 18px;
            padding: 8px 8px 12px;
            width: 118px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 2px solid #394f6b;
            box-shadow: 0 6px 0 #06090e;
        }
        .case-card:hover {
            transform: translateY(-3px);
            border-color: #ffb347;
            box-shadow: 0 4px 0 #06090e, 0 0 20px #ffb34780;
        }
        .case-card.selected {
            border-color: #ffd966;
            box-shadow: 0 4px 0 #06090e, 0 0 30px #ffbb33, 0 0 10px #ffaa33 inset;
            background: #121c2c;
        }
        .case-emoji { font-size: 2.6rem; filter: drop-shadow(0 6px 8px black); margin-bottom: 2px; }
        .case-name {
            font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
            color: #d4e2ff; letter-spacing: 1px; background: #0c121f;
            padding: 3px 0; border-radius: 20px;
        }
        .case-price {
            margin-top: 4px; font-weight: 900; font-size: 0.95rem;
            color: #ffd966; text-shadow: 0 2px 0 #6b4a0e;
        }

        .terminal-btn {
            background: linear-gradient(145deg, #2a1a0f, #130c06);
            border: 2px solid #ffaa33;
            border-radius: 24px;
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #050a10, 0 0 15px #ffb34740;
            padding: 16px 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .terminal-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 2px 0 #050a10, 0 0 30px #ffb347;
            border-color: #ffd966;
        }
        .terminal-icon { font-size: 3rem; margin-bottom: 6px; filter: drop-shadow(0 0 10px #ffb347); }
        .terminal-title {
            font-size: 1rem; font-weight: 900; color: #ffd966;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .terminal-desc { font-size: 0.65rem; color: #b8ccf0; font-weight: 700; text-transform: uppercase; opacity: 0.8; }

        .roulette-section {
            background: #070c14e0;
            border-radius: 24px;
            padding: 12px 0;
            margin: 0 0 12px;
            border: 2px solid #2b3e5a;
            box-shadow: inset 0 0 40px #00000090, 0 0 20px #000000aa;
            position: relative;
            overflow: hidden;
        }
        .roulette-viewport {
            display: flex;
            align-items: center;
            position: relative;
            height: 120px;
            overflow: hidden;
            border-radius: 16px;
            margin: 0 10px;
            background: #04080f;
            box-shadow: inset 0 0 30px black;
        }
        .roulette-track {
            display: flex;
            gap: 8px;
            align-items: center;
            will-change: transform;
            padding: 0 10px;
            position: relative;
        }
        .roulette-item {
            min-width: 110px;
            height: 100px;
            background: linear-gradient(145deg, #141f30, #0a111c);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #2e415a;
            box-shadow: 0 0 8px #000000aa;
            padding: 4px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .roulette-item.winner-highlight {
            border-color: #ffd966;
            box-shadow: 0 0 25px #ffb347, 0 0 10px #ffd966 inset;
            background: linear-gradient(145deg, #2a2a10, #1a1a08);
        }
        
        /* Картинка скина */
        .skin-img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px black);
            transition: 0.2s;
            pointer-events: none;
        }
        .roulette-item .emoji-fallback {
            font-size: 2.2rem;
            line-height: 1;
            filter: drop-shadow(0 4px 6px black);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
        }

        .roulette-item .weapon-name {
            font-size: 0.55rem; color: #b8ccf0; text-align: center;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
            margin-top: 2px; line-height: 1.1; max-width: 100px;
            word-break: break-word; overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .roulette-item .weapon-price { font-size: 0.6rem; color: #ffd966; font-weight: 800; margin-top: 1px; }

        .center-marker {
            position: absolute;
            left: 50%; top: 0; bottom: 0;
            width: 3px;
            background: #ffd966;
            box-shadow: 0 0 20px #ffb347, 0 0 40px #ff7b00;
            transform: translateX(-50%);
            z-index: 5;
            pointer-events: none;
            border-radius: 2px;
        }
        .center-marker::before,
        .center-marker::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
        }
        .center-marker::before { top: -6px; border-top: 10px solid #ffd966; }
        .center-marker::after { bottom: -6px; border-bottom: 10px solid #ffd966; }

        .result-display {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .result-card {
            background: #0f1622;
            border-radius: 20px;
            padding: 12px 30px;
            text-align: center;
            border: 3px solid #ffd966;
            box-shadow: 0 0 25px #ffb347, 0 6px 0 #03060a;
            min-width: 200px;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .result-card .slot-owner {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
            color: #b4c8e0; letter-spacing: 0.5px; margin-bottom: 2px;
        }
        .result-card .slot-avatar { font-size: 2rem; line-height: 1; filter: drop-shadow(0 3px 4px black); }
        .result-card .slot-item {
            margin-top: 4px; font-weight: 800; font-size: 0.9rem;
            color: #ffd966; word-break: break-word;
            display: flex; align-items: center; justify-content: center; line-height: 1.1;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(180deg, #2b3b55, #121d2e);
            border: none;
            border-radius: 60px;
            padding: 12px 30px;
            font-weight: 900;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffdd99;
            border-bottom: 6px solid #050a10;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 5px 20px #00000080;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .btn:disabled {
            opacity: 0.45; transform: translateY(2px);
            border-bottom-width: 4px; pointer-events: none; filter: grayscale(0.5);
        }
        .btn-primary {
            background: linear-gradient(180deg, #ffb347, #e08b1a);
            color: #1a1204;
            border-bottom: 6px solid #6e480c;
            text-shadow: 0 2px 2px #ffdd99;
        }

        .result-area {
            text-align: center;
            margin-top: 4px;
            font-weight: 800;
            font-size: 1.1rem;
            min-height: 2rem;
            color: #ffd966;
            text-shadow: 0 0 15px #ff9f00;
            padding: 4px;
            letter-spacing: 1px;
            background: #0a121fc0;
            border-radius: 40px;
        }

        .inventory-section {
            margin-top: 12px;
            background: #070c14c0;
            border-radius: 24px;
            padding: 10px 10px 8px;
            border: 2px solid #2b3e5a;
        }
        .inventory-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; padding: 0 6px;
        }
        .inventory-title {
            font-weight: 800; font-size: 0.9rem; text-transform: uppercase;
            letter-spacing: 2px; color: #b8ccf0;
        }
        .inventory-total { font-weight: 800; color: #ffd966; font-size: 0.95rem; }
        .inventory-grid {
            display: flex; flex-wrap: wrap; gap: 6px;
            max-height: 200px; overflow-y: auto; padding: 4px 4px 6px;
        }
        .inventory-item {
            background: linear-gradient(145deg, #101b2b, #0a111c);
            border-radius: 12px;
            padding: 6px 6px 4px;
            min-width: 100px; max-width: 115px;
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid #2e415a; position: relative;
            box-shadow: 0 3px 0 #03060a;
            transition: 0.15s;
        }
        .inventory-item:hover { border-color: #ffb347; box-shadow: 0 0 12px #ffb34760; }
        
        .inv-img-wrapper {
            width: 60px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inv-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 3px 4px black);
        }
        
        .inv-name {
            font-size: 0.55rem; font-weight: 700; color: #b8ccf0;
            text-align: center; text-transform: uppercase; margin-top: 3px;
            line-height: 1.1; word-break: break-word; overflow: hidden;
            text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .inv-price { font-size: 0.65rem; font-weight: 800; color: #ffd966; margin-top: 2px; }
        .inv-actions { display: flex; gap: 3px; margin-top: 4px; width: 100%; }
        .inv-btn {
            background: #1f2e42; border: none; border-radius: 20px;
            padding: 2px 4px; font-size: 0.5rem; font-weight: 800;
            text-transform: uppercase; color: #dfe8ff; cursor: pointer;
            transition: 0.1s; border-bottom: 2px solid #0a111c;
            letter-spacing: 0.2px; flex: 1; text-align: center;
        }
        .inv-btn:hover { background: #2e405c; color: #ffd966; }
        .inv-btn.sell { background: #4e3a1c; color: #ffd966; }
        .inv-btn.sell:hover { background: #6b521f; }
        .empty-inventory {
            color: #5b6f8c; font-size: 0.8rem; font-weight: 600;
            padding: 10px; text-align: center; width: 100%;
        }

        .footer-note {
            text-align: center; font-size: 0.75rem; color: #7a8ba8; margin-top: 6px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(180deg, #182336, #0c1420);
            border-radius: 30px; padding: 30px 26px 22px;
            max-width: 360px; width: 90%;
            border: 2px solid #ffcf6e;
            box-shadow: 0 0 50px #ffb34760, 0 20px 40px #000000aa;
            text-align: center;
        }
        .modal h2 {
            color: #ffd966; font-size: 1.4rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 18px; text-shadow: 0 0 15px #ff9f00;
        }
        .modal input {
            width: 100%; background: #0a121f;
            border: 2px solid #3c5777; border-radius: 20px;
            padding: 14px 18px; font-size: 1.3rem; font-weight: 800;
            color: #ffd966; text-align: center; outline: none;
            margin-bottom: 16px; transition: 0.15s;
        }
        .modal input:focus { border-color: #ffd966; box-shadow: 0 0 20px #ffb34760; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .modal-btn {
            padding: 12px 26px; border-radius: 40px; border: none;
            font-weight: 900; font-size: 1rem; text-transform: uppercase;
            cursor: pointer; letter-spacing: 1px; transition: 0.08s linear;
            border-bottom: 5px solid #00000060; flex: 1;
        }
        .modal-btn.confirm {
            background: linear-gradient(180deg, #3ba55c, #24713b);
            color: #e0ffe0; border-bottom-color: #0f3a1e;
        }
        .modal-btn.confirm:hover { background: #4cc76f; }
        .modal-btn.cancel {
            background: linear-gradient(180deg, #3a4a60, #1f2b3b);
            color: #c8d8f0; border-bottom-color: #0d141e;
        }
        .modal-btn.cancel:hover { background: #4a5e7a; }
        .modal-btn:active { transform: translateY(3px); border-bottom-width: 2px; }

        .quick-amounts {
            display: flex; gap: 8px; justify-content: center;
            margin-bottom: 16px; flex-wrap: wrap;
        }
        .quick-btn {
            background: #1a2a3f; border: 2px solid #3c5777;
            border-radius: 30px; padding: 6px 14px;
            color: #ffd966; font-weight: 800; font-size: 0.85rem;
            cursor: pointer; transition: 0.1s;
        }
        .quick-btn:hover { border-color: #ffb347; background: #253a55; }

        .ach-toast {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(180deg, #2a1f08, #1a1208);
            border: 2px solid #ffd966;
            border-radius: 20px;
            padding: 12px 24px;
            color: #ffd966;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 0 40px #ffb34760;
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            pointer-events: none;
        }
        .ach-toast.show { transform: translateX(-50%) translateY(0); }

        /* Терминал */
        .terminal-modal {
            max-width: 500px;
        }
        .terminal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #0a121f;
            padding: 6px;
            border-radius: 20px;
            border: 1px solid #2b3e5a;
        }
        .term-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #5b6f8c;
            cursor: pointer;
            border-radius: 14px;
            transition: 0.15s;
        }
        .term-tab.active {
            background: #1a2a3f;
            color: #ffd966;
            box-shadow: 0 0 10px #ffb34740;
        }
        .term-content {
            background: #0a121f;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2b3e5a;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .term-item-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
            background: #101b2b;
            padding: 14px 24px;
            border-radius: 20px;
            border: 2px solid #3c5777;
            width: 100%;
        }
        .term-item-preview .skin-img {
            width: 120px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px black);
        }
        .term-item-preview .emoji {
            font-size: 3rem;
            margin-bottom: 6px;
        }
        .term-item-preview .name { font-size: 0.85rem; font-weight: 800; color: #d4e2ff; text-transform: uppercase; line-height: 1.2; }
        .term-item-preview .price { font-size: 1rem; font-weight: 900; color: #ffd966; margin-top: 4px; }
        .term-offer-box {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffd966;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .term-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            function playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
                if (!soundEnabled) return;
                initAudio();
                const t = audioCtx.currentTime + delay;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(volume, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + duration);
            }
            function playClick() { playTone(800, 0.05, 'square', 0.08); playTone(1200, 0.04, 'square', 0.05, 0.03); }

            // ==================== УТИЛИТЫ ====================
            function getItemById(id) { return ALL_ITEMS.find(i => i.id === id); }
            
            function getRandomItemFromCase(caseObj) {
                const totalWeight = caseObj.items.reduce((sum, item) => sum + item.weight, 0);
                let rand = Math.random() * totalWeight;
                for (const item of caseObj.items) {
                    rand -= item.weight;
                    if (rand <= 0) {
                        return getItemById(item.id);
                    }
                }
                return getItemById(caseObj.items[0].id);
            }

                    const badge = document.createElement('div');

                    badge.innerHTML = `<span class="ach-icon">${a.icon}</span><span>${a.name}</span>`;
                    achievementsBar.appendChild(badge);
                });
            }

            function unlockAchievement(id) {
                if (unlockedAchievements.has(id)) return;
                unlockedAchievements.add(id);
                renderAchievements();
                saveState();
                const a = ACHIEVEMENTS.find(x => x.id === id);
                if (a) {
                    achToast.textContent = `🏅 Достижение: ${a.icon} ${a.name}!`;
                    achToast.classList.add('show');
                    playAchievement();
                    setTimeout(() => achToast.classList.remove('show'), 3000);
                }
            }

                if (totalSpins >= 10) unlockAchievement('ten_spins');
                if (totalSpins >= 50) unlockAchievement('fifty_spins');
                if (inventory.some(i => i.type === 'knife')) unlockAchievement('first_knife');
                if (inventory.some(i => i.type === 'glove')) unlockAchievement('first_glove');
                if (inventory.some(i => i.type === 'agent')) unlockAchievement('first_agent');
                if (totalSells >= 10) unlockAchievement('sell_10');
                if (balance >= 1000) unlockAchievement('rich_1000');
                if (balance >= 5000) unlockAchievement('rich_5000');
                if (getInventoryTotal() >= GOAL_VALUE) unlockAchievement('goal_reached');
            }

                            ${imgHtml}
                        </div>
                        <div class="inv-name">${item.name}</div>
                        <div class="inv-price">${item.price} ₽</div>
                        <div class="inv-actions">
                            <button class="inv-btn sell" data-idx="${idx}" data-action="sell">Продать</button>
                            <button class="inv-btn" data-idx="${idx}" data-action="withdraw">Вывести</button>
                        </div>
                    `;
                    inventoryGrid.appendChild(div);
                });
                inventoryTotal.textContent = total + ' ₽';
                updateGoal();
                inventoryGrid.querySelectorAll('.inv-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = +btn.dataset.idx;
                        const action = btn.dataset.action;
                        if (action === 'sell') sellItem(idx);
                        else if (action === 'withdraw') withdrawItem(idx);
                    });
                });
            }

            function sellItem(idx) {
                if (spinning) return;
                const item = inventory[idx];
                if (!item) return;
                balance += item.price;
                inventory.splice(idx, 1);
                totalSells++;
                updateBalance();
                renderInventory();
                saveState();
                resultMessage.textContent = `💰 Продан ${item.name} за ${item.price} ₽`;
                playSell();
                checkAchievements();
            }

            function withdrawItem(idx) {
                if (spinning) return;
                const item = inventory[idx];
                if (!item) return;
                inventory.splice(idx, 1);
                renderInventory();
                saveState();
                resultMessage.textContent = `📤 ${item.name} выведен (симуляция)`;
                playWithdraw();
            }

            function addToInventory(item) {
                inventory.push({ ...item, uniqueId: Date.now() + Math.random() });
                renderInventory();
                saveState();
                checkAchievements();
            }

            // ==================== РУЛЕТКА ====================
            function buildRouletteStrip(caseObj, count = 100) {
                rouletteTrack.innerHTML = '';
                for (let i = 0; i < count; i++) {
                    const item = getRandomItemFromCase(caseObj);
                    const div = document.createElement('div');
                    div.className = 'roulette-item';
                    div.dataset.itemId = item.id;
                    
                    const imgUrl = getRealSkinImageUrl(item.id);
                    let imgHtml;
                    if (imgUrl) {
                        imgHtml = `<img src="${imgUrl}" class="skin-img" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\\'emoji-fallback\\'>${item.emoji}</div>';">`;
                    } else {
                        imgHtml = `<div class="emoji-fallback">${item.emoji}</div>`;
                    }

                    div.innerHTML = `
                        ${imgHtml}
                        <div class="weapon-name">${item.name}</div>
                        <div class="weapon-price">${item.price} ₽</div>
                    `;
                    rouletteTrack.appendChild(div);
                }
            }

            async function animateRoulette(finalItem) {
                return new Promise((resolve) => {
                    const items = Array.from(rouletteTrack.children);
                    if (items.length === 0) return resolve();

                    const itemWidth = 110 + 8;
                    const viewport = document.querySelector('.roulette-viewport');
                    const viewportWidth = viewport.clientWidth;
                    const centerOffset = viewportWidth / 2 - 55;

                    let targetIndex = -1;
                    for (let i = items.length - 1; i >= Math.floor(items.length / 2); i--) {
                        if (items[i].dataset.itemId === finalItem.id) {
                            targetIndex = i;
                            break;
                        }
                    }
                    if (targetIndex === -1) {
                        targetIndex = Math.floor(items.length * 0.7);
                        if (items[targetIndex]) {
                            items[targetIndex].dataset.itemId = finalItem.id;
                            
                            const imgUrl = getRealSkinImageUrl(finalItem.id);
                            let imgHtml;
                            if (imgUrl) {
                                imgHtml = `<img src="${imgUrl}" class="skin-img" alt="${finalItem.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\\'emoji-fallback\\'>${finalItem.emoji}</div>';">`;
                            } else {
                                imgHtml = `<div class="emoji-fallback">${finalItem.emoji}</div>`;
                            }

                            items[targetIndex].innerHTML = `
                                ${imgHtml}
                                <div class="weapon-name">${finalItem.name}</div>
                                <div class="weapon-price">${finalItem.price} ₽</div>
                            `;
                        }
                    }

                    const targetScroll = -(targetIndex * itemWidth) + centerOffset;
                    const startScroll = targetScroll - viewportWidth * 5 - 1000;
                    
                    const duration = 5500;
                    const startTime = performance.now();
                    let lastTickTime = 0;

                    rouletteTrack.style.transition = 'none';
                    rouletteTrack.style.transform = `translateX(${startScroll}px)`;

                    function animate(now) {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = 1 - Math.pow(1 - progress, 4);
                        const scroll = startScroll + (targetScroll - startScroll) * eased;
                        rouletteTrack.style.transform = `translateX(${scroll}px)`;

                        const tickInterval = 40 + progress * 200;
                        if (now - lastTickTime > tickInterval) {
                            playTick();
                            lastTickTime = now;
                        }

                        if (progress < 1) requestAnimationFrame(animate);
                        else {
                            rouletteTrack.style.transform = `translateX(${targetScroll}px)`;
                            items.forEach(it => it.classList.remove('winner-highlight'));
                            if (items[targetIndex]) items[targetIndex].classList.add('winner-highlight');
                            resolve();
                        }
                    }
                    requestAnimationFrame(animate);
                });
            }

            // ==================== ПРОКРУТ ====================
            async function spin() {
                if (spinning) return;
                const currentCase = CASES.find(c => c.id === selectedCaseId);
                if (balance < currentCase.price) {
                    resultMessage.textContent = '❌ Недостаточно средств!';
                    playClick();
                    return;
                }

                spinning = true;
                spinBtn.disabled = true;
                resetBtn.disabled = true;
                plusBtn.disabled = true;
                minusBtn.disabled = true;
                openTerminalBtn.style.pointerEvents = 'none';
                resultMessage.textContent = '🎲 Крутим... 🎲';

                balance -= currentCase.price;
                updateBalance();
                playClick();
                totalSpins++;
                saveState();

                const resultItem = getRandomItemFromCase(currentCase);

                buildRouletteStrip(currentCase, 100);

                resultAvatarWrapper.innerHTML = '<div class="slot-avatar">🤖</div>';
                resultItemName.textContent = '—';

                await animateRoulette(resultItem);

                const resImgUrl = getRealSkinImageUrl(resultItem.id);
                let resImgHtml;
                if (resImgUrl) {
                    resImgHtml = `<img src="${resImgUrl}" style="width: 100px; height: 70px; object-fit: contain; margin-top: 4px; filter: drop-shadow(0 4px 6px black);" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\\'slot-avatar\\' style=\\'font-size:2rem\\'>${resultItem.emoji}</div>';">`;
                } else {
                    resImgHtml = `<div class="slot-avatar" style="font-size:2rem">${resultItem.emoji}</div>`;
                }
                
                resultAvatarWrapper.innerHTML = resImgHtml;
                resultItemName.textContent = resultItem.name;

                addToInventory(resultItem);
                resultMessage.textContent = `🏆 Выпал ${resultItem.name} (${resultItem.price} ₽)!`;
                playWin();

                spinning = false;
                spinBtn.disabled = false;
                resetBtn.disabled = false;
                plusBtn.disabled = false;
                minusBtn.disabled = false;
                openTerminalBtn.style.pointerEvents = 'auto';

                if (currentCase.id === 'gold') unlockAchievement('gold_case');
                if (currentCase.id === 'ludka') unlockAchievement('ludka_case');
                checkAchievements();
                saveState();
            }

            // ==================== СБРОС ====================
            function resetGame() {
                if (spinning) return;
                if (!confirm('Вы уверены, что хотите сбросить весь прогресс?')) return;
                
                balance = 500;
                updateBalance();
                selectedCaseId = 'starter';
                inventory = [];
                totalSpins = 0;
                totalSells = 0;
                unlockedAchievements = new Set();
                termCooldownEnd = 0;
                
                renderCases();
                renderInventory();
                renderAchievements();
                resultMessage.textContent = 'Выбери кейс и нажми «Крутить»';
                resultAvatarWrapper.innerHTML = '<div class="slot-avatar">🤖</div>';
                resultItemName.textContent = '—';
                rouletteTrack.innerHTML = '';
                rouletteTrack.style.transform = 'translateX(0px)';
                buildRouletteStrip(CASES[0], 100);
                playClick();
                saveState();
            }

            // ==================== БАЛАНС ====================
            function openModal(mode) {
                if (spinning) return;
                currentModalMode = mode;
                if (mode === 'add') {
                    modalTitle.textContent = 'Пополнить баланс';
                    quickAmounts.innerHTML = `
                        <button class="quick-btn" data-amt="100">+100</button>
                        <button class="quick-btn" data-amt="500">+500</button>
                        <button class="quick-btn" data-amt="1000">+1000</button>
                        <button class="quick-btn" data-amt="5000">+5000</button>
                    `;
                } else {
                    modalTitle.textContent = 'Вычесть баланс';
                    quickAmounts.innerHTML = `
                        <button class="quick-btn" data-amt="100">−100</button>
                        <button class="quick-btn" data-amt="500">−500</button>
                        <button class="quick-btn" data-amt="1000">−1000</button>
                        <button class="quick-btn" data-amt="5000">−5000</button>
                    `;
                }
                quickAmounts.querySelectorAll('.quick-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        moneyInput.value = btn.dataset.amt;
                        playClick();
                    });
                });
                moneyInput.value = '';
                moneyModal.classList.add('active');
                setTimeout(() => moneyInput.focus(), 100);
                playClick();
            }

            function closeModal() { moneyModal.classList.remove('active'); }

            function confirmMoney() {
                const amount = parseInt(moneyInput.value);
                if (isNaN(amount) || amount <= 0) {
                    resultMessage.textContent = '❌ Введите корректную сумму!';
                    playClick();
                    return;
                }
                if (currentModalMode === 'add') {
                    balance += amount;
                    updateBalance();
                    resultMessage.textContent = `✅ Баланс пополнен на ${amount} ₽`;
                    playAddMoney();
                } else {
                    if (amount > balance) {
                        resultMessage.textContent = '❌ Недостаточно средств для вычета!';
                        playClick();
                        return;
                    }
                    balance -= amount;
                    updateBalance();
                    resultMessage.textContent = `✅ Вычтено ${amount} ₽ с баланса`;
                    playSubtractMoney();
                }
                closeModal();
                checkAchievements();
                saveState();
            }

            function toggleSound() {
                soundEnabled = !soundEnabled;
                soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
                if (soundEnabled) playClick();
            }

            // ==================== ТЕРМИНАЛ ====================
            function openTerminal() {
                if (spinning) return;
                terminalModal.classList.add('active');
                termMode = 'sell';
                updateTerminalTabs();
                renderTerminal();
                playClick();
            }

            function closeTerminal() {
                terminalModal.classList.remove('active');
                termOffer = null;
                termItemIdx = -1;
                if (termCooldownInterval) {
                    clearInterval(termCooldownInterval);
                    termCooldownInterval = null;
                }
            }

            function updateTerminalTabs() {
                termTabs.forEach(t => {
                    t.classList.toggle('active', t.dataset.tab === termMode);
                });
            }

            function renderTerminal() {
                if (termMode === 'sell') {
                    renderSellTerminal();
                } else {
                    renderBuyTerminal();
                }
            }

            function getCooldownRemaining() {
                const now = Date.now();
                return Math.max(0, Math.ceil((termCooldownEnd - now) / 1000));
            }

            function startCooldown() {
                termCooldownEnd = Date.now() + 60000;
                saveState();
                updateCooldownUI();
                
                if (termCooldownInterval) clearInterval(termCooldownInterval);
                termCooldownInterval = setInterval(() => {
                    const remain = getCooldownRemaining();
                    if (remain <= 0) {
                        clearInterval(termCooldownInterval);
                        termCooldownInterval = null;
                        updateCooldownUI();
                    } else {
                        updateCooldownUI();
                    }
                }, 1000);
            }

            function updateCooldownUI() {
                const btn = document.getElementById('termNextBtn');
                if (!btn) return;
                const remain = getCooldownRemaining();
                if (remain > 0) {
                    btn.disabled = true;
                    btn.textContent = `ЖДИТЕ (${remain}с)`;
                    btn.style.opacity = '0.6';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Другой оффер';
                    btn.style.opacity = '1';
                }
            }

            function renderSellTerminal() {
                if (inventory.length === 0) {
                    termContent.innerHTML = `<div class="term-empty">У вас нет предметов для продажи!</div>`;
                    return;
                }

                if (!termOffer || termItemIdx === -1 || termItemIdx >= inventory.length) {
                    termItemIdx = Math.floor(Math.random() * inventory.length);
                    const item = inventory[termItemIdx];
                    const multiplier = 0.3 + Math.random() * 1.7; 
                    const offerPrice = Math.round(item.price * multiplier);
                    termOffer = { item, offerPrice, multiplier };
                }

                const { item, offerPrice, multiplier } = termOffer;
                const isGood = multiplier >= 1.0;
                const remain = getCooldownRemaining();

                const imgUrl = getRealSkinImageUrl(item.id);
                let imgHtml;
                if (imgUrl) {
                    imgHtml = `<img src="${imgUrl}" class="skin-img" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\\'emoji\\'>${item.emoji}</div>';">`;
                } else {
                    imgHtml = `<div class="emoji">${item.emoji}</div>`;
                }

                termContent.innerHTML = `
                    <div class="term-item-preview">
                        ${imgHtml}
                        <div class="name">${item.name}</div>
                        <div class="price">Рыночная цена: ${item.price} ₽</div>
                    </div>
                    <div class="term-offer-box">
                        Скупщик предлагает: <br>
                        <span style="font-size: 1.6rem; color: ${isGood ? '#7fffb0' : '#ff7b7b'};">${offerPrice} ₽</span>
                        <br>
                        <span style="font-size: 0.8rem; opacity: 0.7;">(это ${Math.round(multiplier * 100)}% от рыночной)</span>
                    </div>
                    <div class="term-actions">
                        <button class="btn" id="termNextBtn" style="background: #2b3b55;">Другой оффер</button>
                        <button class="btn btn-primary" id="termAcceptBtn">Продать</button>
                    </div>
                `;

                if (remain > 0) {
                    const btn = document.getElementById('termNextBtn');
                    btn.disabled = true;
                    btn.textContent = `ЖДИТЕ (${remain}с)`;
                    btn.style.opacity = '0.6';
                }

                document.getElementById('termNextBtn').addEventListener('click', () => {
                    if (getCooldownRemaining() > 0) return;
                    termOffer = null;
                    termItemIdx = -1;
                    playClick();
                    startCooldown();
                    renderTerminal();
                });

                document.getElementById('termAcceptBtn').addEventListener('click', () => {
                    balance += offerPrice;
                    inventory.splice(termItemIdx, 1);
                    totalSells++;
                    updateBalance();
                    renderInventory();
                    termOffer = null;
                    termItemIdx = -1;
                    resultMessage.textContent = `💻 Терминал: продан ${item.name} за ${offerPrice} ₽`;
                    playSell();
                    checkAchievements();
                    saveState();
                    renderTerminal();
                });
            }

            function renderBuyTerminal() {
                if (!termOffer) {
                    const randomItem = ALL_ITEMS[Math.floor(Math.random() * ALL_ITEMS.length)];
                    const multiplier = 0.5 + Math.random() * 1.0;
                    const offerPrice = Math.round(randomItem.price * multiplier);
                    termOffer = { item: randomItem, offerPrice, multiplier };
                }

                const { item, offerPrice, multiplier } = termOffer;
                const isGood = multiplier <= 0.8;
                const canAfford = balance >= offerPrice;
                const remain = getCooldownRemaining();

                const imgUrl = getRealSkinImageUrl(item.id);
                let imgHtml;
                if (imgUrl) {
                    imgHtml = `<img src="${imgUrl}" class="skin-img" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\\'emoji\\'>${item.emoji}</div>';">`;
                } else {
                    imgHtml = `<div class="emoji">${item.emoji}</div>`;
                }

                termContent.innerHTML = `
                    <div class="term-item-preview">
                        ${imgHtml}
                        <div class="name">${item.name}</div>
                        <div class="price">Рыночная цена: ${item.price} ₽</div>
                    </div>
                    <div class="term-offer-box">
                        Барыга просит: <br>
                        <span style="font-size: 1.6rem; color: ${isGood ? '#7fffb0' : '#ffd966'};">${offerPrice} ₽</span>
                        <br>
                        <span style="font-size: 0.8rem; opacity: 0.7;">(это ${Math.round(multiplier * 100)}% от рыночной)</span>
                    </div>
                    <div class="term-actions">
                        <button class="btn" id="termNextBtn" style="background: #2b3b55;">Другой оффер</button>
                        <button class="btn btn-primary" id="termAcceptBtn" ${canAfford ? '' : 'disabled style="opacity:0.5;"'}>Купить</button>
                    </div>
                `;

                if (remain > 0) {
                    const btn = document.getElementById('termNextBtn');
                    btn.disabled = true;
                    btn.textContent = `ЖДИТЕ (${remain}с)`;
                    btn.style.opacity = '0.6';
                }

                document.getElementById('termNextBtn').addEventListener('click', () => {
                    if (getCooldownRemaining() > 0) return;
                    termOffer = null;
                    playClick();
                    startCooldown();
                    renderTerminal();
                });

                if (canAfford) {
                    document.getElementById('termAcceptBtn').addEventListener('click', () => {
                        balance -= offerPrice;
                        inventory.push({ ...item, uniqueId: Date.now() + Math.random() });
                        updateBalance();
                        renderInventory();
                        termOffer = null;
                        resultMessage.textContent = `💻 Терминал: куплен ${item.name} за ${offerPrice} ₽`;
                        playClick();
                        checkAchievements();
                        saveState();
                        renderTerminal();
                    });
                }
            }

            termTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    termMode = tab.dataset.tab;
                    termOffer = null;
                    termItemIdx = -1;
                    updateTerminalTabs();
                    renderTerminal();
                    playClick();
                });
            });

            openTerminalBtn.addEventListener('click', openTerminal);
            terminalModal.addEventListener('click', (e) => {
                if (e.target === terminalModal) closeTerminal();
            });

            // ==================== ИНИЦИАЛИЗАЦИЯ ====================
            function init() {
                loadState();
                
                renderCases();
                renderInventory();
                renderAchievements();
                updateBalance();
                
                buildRouletteStrip(CASES.find(c => c.id === selectedCaseId) || CASES[0], 100);

                spinBtn.addEventListener('click', spin);
                resetBtn.addEventListener('click', resetGame);
                plusBtn.addEventListener('click', () => openModal('add'));
                minusBtn.addEventListener('click', () => openModal('subtract'));
                soundToggle.addEventListener('click', toggleSound);
                modalConfirm.addEventListener('click', confirmMoney);
                modalCancel.addEventListener('click', closeModal);
                moneyInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') confirmMoney();
                    if (e.key === 'Escape') closeModal();
                });
                moneyModal.addEventListener('click', (e) => {
                    if (e.target === moneyModal) closeModal();
                });
            }

            init();
        })();
    </script>
</body>
</html>
